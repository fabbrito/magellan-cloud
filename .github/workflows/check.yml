# The gate over the whole tree: every PR, and every deploy before it ships. No
# secrets: a fork's PR runs this too, once the maintainer approves it.
name: check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pins in .config/mise/conf.d/, so CI runs what the hooks run.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile
      - run: make check
