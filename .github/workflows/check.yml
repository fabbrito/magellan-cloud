# The gate over the whole tree: every PR, and every deploy before it ships. No
# secrets: a fork's PR runs this too, once the maintainer approves it.
name: check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR replaces the run testing the old one. A deploy's call
# always finishes.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pins in .config/mise/conf.d/, so CI runs what the hooks run.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      - run: make check
