# A merge to main ships: check, migrate, then ingest before api - after a
# migration the running ingest may write a shape the database no longer takes.
# The D1 id and the account stay secrets: the live id is never committed.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

# One deploy at a time, none cancelled: a half-run migrate is worse than a wait.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile
      - name: render the live configs
        run: |
          for app in ingest-worker api-worker; do
            scripts/prod-config.sh "$D1_DATABASE_ID" "apps/$app/wrangler.jsonc" "apps/$app/wrangler.prod.jsonc"
          done
      # No prompt in CI: wrangler confirms on its own when it sees no TTY.
      - name: migrate
        working-directory: apps/ingest-worker
        run: bunx wrangler d1 migrations apply DB --remote -c wrangler.prod.jsonc
      - name: deploy ingest
        working-directory: apps/ingest-worker
        run: bunx wrangler deploy -c wrangler.prod.jsonc
      - name: deploy api
        working-directory: apps/api-worker
        run: bunx wrangler deploy -c wrangler.prod.jsonc
