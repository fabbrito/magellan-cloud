# A merge to main ships: check, migrate, then ingest before api and admin -
# after a migration the running ingest may write a shape the database no longer
# takes.
# The D1 id and the account stay secrets: the live id is never committed.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

# One deploy at a time, none cancelled: a half-run migrate is worse than a wait.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Secrets go to the steps that call Cloudflare, never the job: an install or
    # a tool restored from cache never holds the token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: main's is written by check, whose tools never see a secret.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
      # No lifecycle scripts: wrangler bundles and deploys without them.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: render the live configs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          for app in ingest-worker api-worker admin-worker; do
            scripts/prod-config.sh "$D1_DATABASE_ID" "apps/$app/wrangler.jsonc" "apps/$app/wrangler.prod.jsonc"
          done
      # No prompt in CI: wrangler confirms on its own when it sees no TTY.
      - name: migrate
        working-directory: apps/ingest-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply DB --remote -c wrangler.prod.jsonc
      - name: deploy ingest
        working-directory: apps/ingest-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.prod.jsonc
      - name: deploy api
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.prod.jsonc
      # The hash ships with the version it guards, never as a step of its own
      # that would publish one without the other.
      - name: deploy admin
        working-directory: apps/admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN_HASH: ${{ secrets.ADMIN_TOKEN_HASH }}
        # A malformed hash would deploy a worker that answers 500 to everyone.
        run: |
          if ! [[ $ADMIN_TOKEN_HASH =~ ^[0-9a-f]{64}$ ]]; then
            echo "ADMIN_TOKEN_HASH is not a SHA-256 hex digest: bun run mint:admin" >&2
            exit 1
          fi
          secrets="$RUNNER_TEMP/admin-secrets.json"
          jq -n --arg hash "$ADMIN_TOKEN_HASH" '{ADMIN_TOKEN_HASH: $hash}' >"$secrets"
          bunx wrangler deploy -c wrangler.prod.jsonc --secrets-file "$secrets"
