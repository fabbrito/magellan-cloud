# This repo's whole hook policy. The engine beside it is vendored from
# fabbrito/githooks v0.2.3 — bump it by copying a newer tag, edit this.
# The version is named here and nowhere else, so a bump is one file.
schema = 1

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

# Cross-cutting names, then one scope per workspace.
scope_fixed = repo deps docs
scope_root  = packages/*/
scope_root  = apps/*/
scope_root  = tools/*/

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes

# require is true everywhere: AGENTS.md forbids a red tree, and a lane that
# skipped itself is not a green commit. oxfmt and oxlint arrive with
# `bun install`; shfmt and shellcheck are the machine's to provide.
#
# No lane reaches Cloudflare: anything that authenticates there is the
# maintainer's to run, never a hook between you and a commit.

# oxfmt, not prettier: it is already this repo's formatter and it takes
# markdown, json and yaml too. --no-error-on-unmatched-pattern because a
# staged file inside .oxfmtrc.json's ignorePatterns leaves oxfmt nothing to
# do, and its bare exit 2 there would read as a broken environment.
[group fmt]
match   = *.ts *.tsx *.mts *.cts *.js *.mjs *.cjs *.json *.md *.yml *.yaml
scope   = staged
require = true
run     = bun oxfmt --check --no-error-on-unmatched-pattern
fix     = bun oxfmt --no-error-on-unmatched-pattern

# A formatter's own config redefines "formatted" for every file it reaches,
# not just the changed ones, so it is the one change that pays for the whole
# tree. No paths: oxfmt reads its own ignorePatterns.
[group fmt-config]
match   = .oxfmtrc.json
scope   = tree
require = true
run     = bun oxfmt --check
fix     = bun oxfmt

# tree, not staged: tsc cannot typecheck a half-staged file, and
# import/no-cycle reads the whole graph — a formatted file can still close a
# cycle against an unformatted one.
#
# No fix: oxlint --fix rewrites code rather than whitespace, and applying that
# mid-commit is a decision. `bun run lint --fix` is where it stays deliberate.
[group ts]
match   = *.ts *.tsx *.mts *.cts *.js *.mjs *.cjs .oxlintrc.json tsconfig.json tsconfig.base.json */tsconfig.json package.json */package.json bun.lock
scope   = tree
require = true
run     = bun oxlint --tsconfig ./tsconfig.base.json --deny-warnings
run     = bun run --filter * typecheck

# .githooks/githooks is left out of match — upstream's formatting is not ours
# to grade, and a style bump upstream would go red on an old vendored copy.
[group shell]
match   = *.sh .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x
