# This repo's commit-message policy, graded by commit-msg-lint (repokit).
# Keys: repokit's commit-msg.conf.example. Lanes live in lefthook.yml.
schema = 2

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

# Cross-cutting names, then one scope per workspace.
scope_fixed = repo deps docs
scope_root  = packages/*/
scope_root  = apps/*/
scope_root  = tools/*/

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes
